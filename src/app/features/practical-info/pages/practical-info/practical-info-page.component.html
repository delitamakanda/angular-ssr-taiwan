@if (page(); as p) {
  <article class="mx-auto px-4 py-10">
    <div class="relative z-10">
      <img
        [ngSrc]="coverImage()"
        [alt]="p.cover_image_url ? p.title : ''"
        class="object-cover w-full h-64"
        [priority]="priority() === 'high'"
        [width]="1920"
        [height]="1080"
      />
      @if (!p.cover_image_url) {
        <div
          class="absolute top-0 left-0 w-full h-full bg-gray-800 opacity-50"
          aria-hidden="true"
        ></div>
      }
    </div>
    <h1 class="text-3xl font-bold mb-6">{{ p.title }}</h1>
    <div class="text-lg text-gray-700 mb-6" [innerHTML]="p.content"></div>
  </article>
}
