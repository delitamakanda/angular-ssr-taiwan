<div class="space-y-8">
  <div class="space-y-4">
    <a
      routerLink="/"
      class="inline-flex items-center text-sm text-gray-600 hover:text-black transition"
    >
      <span i18n>&larr; Back to home</span>
    </a>
    <h1 class="text-4xl font-bold tracking-tight" i18n>Practical info</h1>
  </div>
  <nav class="flex flex-wrap gap-2">
    @if (store.loading()) {
      <p role="status" i18n>Loading...</p>
    } @else if (!store.items().length) {
      <p i18n>No items found.</p>
    } @else {
      @for (item of store.items(); track item.id) {
        <a
          [routerLink]="item.slug"
          routerLinkActive="border-black text-black"
          class="rounded-full px-4 py-2 text-sm font-medium bg-gray-100 text-gray-700 hover:bg-gray-200 transition"
        >
          {{ item.title }}
        </a>
      }
    }
  </nav>

  <div class="py-4">
    <router-outlet />
  </div>
</div>
