<section class="space-y-6">
  <div class="space-y-2">
    <h1 class="text-3xl font-bold" i18n>Destinations</h1>
    <p class="text-gray-600" i18n>Explore some of Taiwan's most beautiful destinations.</p>

    <app-destination-filter
      (filter)="onSearch($event)"
      [search]="store.searchTerm()"
    ></app-destination-filter>

    @if (store.loading()) {
      <p role="status" i18n>Loading...</p>
    } @else if (!store.filteredItems().length) {
      <p i18n>No destinations found.</p>
    } @else {
      <div class="grid grid-cols-2 gap-4">
        @for (item of store.filteredItems(); track item.id; let i = $index) {
          <app-destination-card [destination]="item" [priority]="i === 0 ? 'high' : 'low'" />
        }
      </div>
    }
  </div>
</section>
