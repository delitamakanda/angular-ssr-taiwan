<section class="space-y-6">
  <div class="space-y-2">
    <app-article-hero [title]="'Blog'" />

    @if (store.loading()) {
      <p role="status" i18n>Loading...</p>
    } @else if (!store.articles().length) {
      <p i18n>No post found.</p>
    } @else {
      <div class="grid grid-cols-2 gap-4">
        @for (item of store.articles(); track item.id; let i = $index) {
          <app-article-card [post]="item" [priority]="i === 0 ? 'high' : 'low'" />
        }
      </div>
    }
  </div>
</section>
